<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header>
    <nav class="navbar">
        <h2>ShopEasy</h2>

        <input type="text" id="search" placeholder="Search Products...">

        <div class="cart-icon">
            🛒 <span id="cart-count">0</span>
        </div>
    </nav>
</header>

<!-- Hero -->
<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Best Deals on Electronics & Fashion</p>
</section>

<!-- Products -->
<section class="products">

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="">
        <h3>Laptop</h3>
        <p>₹55000</p>
        <button onclick="addToCart('Laptop',55000)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="">
        <h3>Headphones</h3>
        <p>₹2500</p>
        <button onclick="addToCart('Headphones',2500)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="">
        <h3>Smart Watch</h3>
        <p>₹3999</p>
        <button onclick="addToCart('Smart Watch',3999)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="">
        <h3>Shoes</h3>
        <p>₹1999</p>
        <button onclick="addToCart('Shoes',1999)">Add to Cart</button>
    </div>

</section>

<!-- Cart -->
<section class="cart">
    <h2>Shopping Cart</h2>

    <ul id="cart-items"></ul>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="checkout()">Checkout</button>

</section>

<footer>
    <p>© 2026 ShopEasy | All Rights Reserved</p>
</footer>

<script src="script.js"></script>

</body>
</html>
